<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabby · 完整 Dashboard 验收</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3f6;color:#302d38;font:12px ui-monospace,monospace}.bar{min-height:54px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid #dedbe6}.bar strong{color:#7c3aed}.bar small{color:#8b8495}button{border:1px solid #dcd5e7;background:white;padding:5px 8px;color:#6d6578;font:inherit;cursor:pointer}button[aria-pressed=true]{color:#7c3aed;border-color:#a889d3;background:#f4eefd}#stages{display:flex;gap:5px;flex-wrap:wrap}#viewport{overflow:hidden}iframe{display:block;border:0;transform-origin:top left}#notice{color:#946b35;font-size:11px}</style></head><body><div class="bar"><strong>Dashboard 验收</strong><small>示例账户与任务 · 无需登录 · 不发送交易</small><button id="play">▶ 播放完整流程</button><div id="stages"></div><span id="notice"></span></div><div id="viewport"><iframe title="完整 Dashboard" src="/dashboard-frame"></iframe></div><script>
const frame=document.querySelector('iframe'),viewport=document.querySelector('#viewport'),bar=document.querySelector('.bar');
const labels=['寻找专家','选中专家','执行任务','等待模型','收取结果','独立复核','交付完成'];
const send=data=>frame.contentWindow.postMessage(data,location.origin);
labels.forEach((label,index)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>send({type:'stage',index});b.setAttribute('aria-pressed',index===0?'true':'false');document.querySelector('#stages').append(b)});
document.querySelector('#play').onclick=()=>send({type:'play'});
function fit(){const w=Math.max(1280,innerWidth),scale=innerWidth/w,h=Math.max(540,(innerHeight-bar.offsetHeight)/scale);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${scale})`;viewport.style.height=h*scale+'px'}
window.addEventListener('resize',fit);new ResizeObserver(fit).observe(bar);fit();
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data.type==='progress')document.querySelectorAll('#stages button').forEach((b,i)=>b.setAttribute('aria-pressed',i===e.data.index?'true':'false'));if(e.data.type==='notice')document.querySelector('#notice').textContent=e.data.text});
</script></body></html>
