server {
    listen 80;
    server_name tempo.tabbyai.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://tempo.tabbyai.xyz$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name tempo.tabbyai.xyz;
    ssl_certificate /etc/letsencrypt/live/tempo.tabbyai.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tempo.tabbyai.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TempoTLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 128k;
    client_header_timeout 15s;
    client_body_timeout 30s;

    # All browser APIs pass through Next's same-origin validation/projections.
    # No Hosted, relay, Arena, Magpie or supplier port is publicly proxied.
    location / {
        proxy_pass http://127.0.0.1:3028;
        proxy_http_version 1.1;
        proxy_set_header Host tempo.tabbyai.xyz;
        proxy_set_header X-Forwarded-Host tempo.tabbyai.xyz;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
